<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meridian — Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="shell">

<!-- ═══════════════════════════════════════════ SIDEBAR ═══ -->
<nav class="sidebar">
  <div class="logo">
    <div class="logo-mark">M</div>
    <div>
      <div class="logo-name">Meridian</div>
      <div class="logo-sub">Ops Hub</div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-item active" data-view="board">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="2" width="4" height="12" rx="1"/><rect x="6" y="2" width="4" height="8" rx="1"/><rect x="11" y="2" width="4" height="10" rx="1"/></svg>
      Board
    </button>
    <button class="nav-item" data-view="list">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h10M4 8h10M4 12h7"/><circle cx="1.5" cy="4" r=".75" fill="currentColor" stroke="none"/><circle cx="1.5" cy="8" r=".75" fill="currentColor" stroke="none"/><circle cx="1.5" cy="12" r=".75" fill="currentColor" stroke="none"/></svg>
      List
    </button>
    <button class="nav-item" data-view="timeline">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="14" height="11" rx="1"/><path d="M5 1v4M11 1v4M1 7h14"/></svg>
      Timeline
    </button>
    <button class="nav-item" data-view="requests">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h12a1 1 0 011 1v8a1 1 0 01-1 1H2a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M1 4l7 4 7-4"/></svg>
      Requests
      <span class="nav-badge" id="nav-req-badge">4</span>
    </button>
    <button class="nav-item" data-view="projects">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h4l2 2h6a1 1 0 011 1v7a1 1 0 01-1 1H2a1 1 0 01-1-1V4a1 1 0 011-1z"/></svg>
      Projects
    </button>
    <button class="nav-item" data-view="mywork">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>
      My Work
    </button>
  </div>

  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="avatar">JM</div>
      <div>
        <div class="user-name">Jordan Miller</div>
        <div class="user-role">Ops Coordinator</div>
      </div>
    </div>
  </div>
</nav>

<!-- ═══════════════════════════════════════════ MAIN ═══ -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="btn btn-ghost btn-back" id="proj-back" style="display:none">← All Tasks</button>
    <div class="page-title" id="page-title">Board</div>
    <div class="topbar-right">
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
        <input type="text" placeholder="Search tasks…" id="search-input" />
      </div>
      <button class="btn btn-primary" id="btn-new-task">+ New Task</button>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>Status</label>
      <select id="filter-status">
        <option value="all">All</option>
        <option value="pending">Pending</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Priority</label>
      <select id="filter-priority">
        <option value="all">All</option>
        <option value="urgent">Urgent</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Owner</label>
      <select id="filter-owner">
        <option value="all">All</option>
        <option value="Jordan Miller">Jordan Miller</option>
        <option value="Priya Shah">Priya Shah</option>
        <option value="Carlos Reyes">Carlos Reyes</option>
        <option value="Aisha Okafor">Aisha Okafor</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Project</label>
      <select id="filter-project">
        <option value="all">All</option>
        <option value="P-001">Q2 Onboarding</option>
        <option value="P-002">Office Relocation</option>
        <option value="P-003">Policy Updates</option>
        <option value="P-004">Vendor Management</option>
        <option value="P-005">Q1 Wrap-up</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Team</label>
      <select id="filter-team">
        <option value="all">All</option>
        <option value="People Ops">People Ops</option>
        <option value="HR">HR</option>
        <option value="Operations">Operations</option>
      </select>
    </div>
    <button class="btn-clear-filters" id="btn-clear-filters">Clear filters</button>
  </div>

  <!-- ═══════════════════════════════ CONTENT ═══ -->
  <div class="content">

    <!-- ═══════ VIEW: KANBAN BOARD ═══════ -->
    <div class="view active" id="view-board">
      <div class="kanban">
        <div class="kanban-col" data-status="pending">
          <div class="kanban-col-header">
            <span class="col-dot dot-pending"></span>
            <span class="col-title">Pending</span>
            <span class="col-count" id="count-pending">0</span>
          </div>
          <div class="kanban-cards" id="col-pending"></div>
        </div>

        <div class="kanban-col" data-status="in-progress">
          <div class="kanban-col-header">
            <span class="col-dot dot-in-progress"></span>
            <span class="col-title">In Progress</span>
            <span class="col-count" id="count-in-progress">0</span>
          </div>
          <div class="kanban-cards" id="col-in-progress"></div>
        </div>

        <div class="kanban-col" data-status="completed">
          <div class="kanban-col-header">
            <span class="col-dot dot-completed"></span>
            <span class="col-title">Completed</span>
            <span class="col-count" id="count-completed">0</span>
          </div>
          <div class="kanban-cards" id="col-completed"></div>
        </div>
      </div>
    </div>

    <!-- ═══════ VIEW: LIST ═══════ -->
    <div class="view" id="view-list">
      <div class="list-container">
        <div class="list-header">
          <span class="lh-title">Task</span>
          <span class="lh-cell">Priority</span>
          <span class="lh-cell">Owner</span>
          <span class="lh-cell">Due</span>
          <span class="lh-cell">Status</span>
        </div>
        <div id="task-list"></div>
      </div>
    </div>

    <!-- ═══════ VIEW: TIMELINE ═══════ -->
    <div class="view" id="view-timeline">
      <div class="tl-toolbar">
        <div class="tl-mode-tabs">
          <button class="tl-mode-tab active" data-tl-mode="week">Week</button>
          <button class="tl-mode-tab" data-tl-mode="month">Month</button>
        </div>
        <div class="tl-nav">
          <button class="btn btn-ghost btn-sm" id="tl-prev">←</button>
          <span class="tl-nav-label" id="tl-nav-label"></span>
          <button class="btn btn-ghost btn-sm" id="tl-next">→</button>
          <button class="btn btn-ghost btn-sm" id="tl-today-btn">Today</button>
        </div>
      </div>

      <!-- Weekly view -->
      <div class="tl-week-view" id="tl-week-view">
        <div class="tl-overdue-strip" id="tl-week-overdue"></div>
        <div class="tl-week-grid" id="tl-week-grid"></div>
      </div>

      <!-- Monthly overview -->
      <div class="tl-month-view" id="tl-month-view" style="display:none">
        <div class="tl-month-grid" id="tl-month-grid"></div>
      </div>
    </div>

    <!-- ═══════ VIEW: REQUESTS ═══════ -->
    <div class="view" id="view-requests">
      <div class="requests-container">
        <div class="requests-header">
          <span>Incoming Requests</span>
          <span class="req-count" id="req-count">0 open</span>
        </div>
        <div id="request-list"></div>
      </div>
    </div>

    <!-- ═══════ VIEW: PROJECTS ═══════ -->
    <div class="view" id="view-projects">
      <div class="projects-container">
        <div class="projects-header">
          <span>Projects</span>
          <span class="proj-count">— click a project to view its tasks</span>
        </div>
        <div id="projects-list"></div>
      </div>
    </div>

    <!-- ═══════ VIEW: MY WORK ═══════ -->
    <div class="view" id="view-mywork">
      <div class="mywork-container">
        <div class="mw-stats" id="mw-stats"></div>
        <div class="mw-section" id="mw-overdue"></div>
        <div class="mw-section" id="mw-today"></div>
        <div class="mw-section" id="mw-upcoming"></div>
        <div class="mw-section" id="mw-projects"></div>
        <div class="mw-section" id="mw-requests"></div>
        <div class="mw-section" id="mw-activity"></div>
      </div>
    </div>

  </div>
</div>

</div><!-- /shell -->


<!-- ═══════════════════════ TASK DETAIL DRAWER ════════════ -->
<div class="overlay" id="overlay"></div>

<div class="drawer" id="drawer">
  <div class="dwr-head">
    <div class="dwr-head-top">
      <span class="task-id-label" id="drawer-id"></span>
      <button class="close-btn" id="btn-close-drawer">×</button>
    </div>
    <input type="text" class="dwr-title-input" id="drawer-title" placeholder="Task title" />
  </div>
  <div class="dwr-body">
    <div class="dwr-fields">
      <div class="dwr-field">
        <label>Status</label>
        <select id="drawer-status">
          <option value="pending">Pending</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="dwr-field">
        <label>Priority</label>
        <select id="drawer-priority">
          <option value="urgent">Urgent</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="dwr-field">
        <label>Owner</label>
        <select id="drawer-owner">
          <option value="">Unassigned</option>
          <option value="Jordan Miller">Jordan Miller</option>
          <option value="Priya Shah">Priya Shah</option>
          <option value="Carlos Reyes">Carlos Reyes</option>
          <option value="Aisha Okafor">Aisha Okafor</option>
        </select>
      </div>
      <div class="dwr-field">
        <label>Due Date</label>
        <input type="date" id="drawer-due" />
      </div>
      <div class="dwr-field">
        <label>Type</label>
        <select id="drawer-type">
          <option value="task">Task</option>
          <option value="request">Request</option>
        </select>
      </div>
      <div class="dwr-field">
        <label>Project</label>
        <select id="drawer-project">
          <option value="">None</option>
          <option value="P-001">Q2 Onboarding</option>
          <option value="P-002">Office Relocation</option>
          <option value="P-003">Policy Updates</option>
          <option value="P-004">Vendor Management</option>
          <option value="P-005">Q1 Wrap-up</option>
        </select>
      </div>
      <div class="dwr-field">
        <label>Team</label>
        <select id="drawer-team">
          <option value="">None</option>
          <option value="People Ops">People Ops</option>
          <option value="HR">HR</option>
          <option value="Operations">Operations</option>
        </select>
      </div>
      <div class="dwr-field">
        <label>Source</label>
        <input type="text" id="drawer-source" placeholder="e.g. Slack, Email" />
      </div>
    </div>

    <div class="dwr-section">
      <label>Description</label>
      <textarea id="drawer-desc" rows="4" placeholder="Add details…"></textarea>
    </div>

    <!-- Attachments -->
    <div class="dwr-section" id="drawer-attachments-section">
      <div class="dwr-section-header">
        <label>Attachments</label>
        <label class="dwr-upload-btn" id="btn-upload-file">
          + Add file
          <input type="file" id="file-input" multiple hidden />
        </label>
      </div>
      <div id="drawer-attachments" class="dwr-attachments-list"></div>
    </div>

    <!-- Comments -->
    <div class="dwr-section" id="drawer-comments-section">
      <label>Comments</label>
      <div id="drawer-comments" class="dwr-comments-list"></div>
      <div class="dwr-comment-input">
        <input type="text" id="comment-input" placeholder="Add a comment…" />
        <button class="btn btn-primary btn-sm" id="btn-add-comment">Post</button>
      </div>
    </div>

    <!-- Activity Log -->
    <div class="dwr-section" id="drawer-activity-section">
      <label>Activity</label>
      <div id="drawer-activity" class="dwr-activity-list"></div>
    </div>

    <div class="dwr-actions">
      <button class="btn btn-primary" id="btn-save-task">Save</button>
      <button class="btn btn-danger" id="btn-delete-task">Delete</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
